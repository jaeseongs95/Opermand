name: Java real OpenSSH

# The SSH adapter of the Java 3.0 line against a real OpenSSH server (stage 3 design 7.2, 7.3 and decision D3-11).
# The tests (:portal-ssh:realOpenSshTest) are Java; only the preparation of the server (an OS account, a sudoers rule, sshd) is a script, because the JDK has no API for it:
#   Linux   java/ci/openssh-linux.sh     a second sshd on the runner, an account that may run sftp-server through sudo -n
#   Windows java/ci/openssh-windows.cmd  the OpenSSH Server capability, a non-administrator account, sshd as SYSTEM in a scheduled task
# The task fails when a property is missing and when it ran no test, so a job can neither skip nor pass without a real server.

on:
  push:
    branches: [develop, 'feature/v300-**']
    paths:
      - 'java/**'
      - '.github/workflows/java-openssh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-openssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openssh-linux:
    name: Real OpenSSH on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same pins as linux-regression.yml and windows-ssh.yml (the official actions/checkout and actions/upload-artifact repositories).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Official action, major tag.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the OpenSSH server (account, sudoers rule, sshd)
        run: sh java/ci/openssh-linux.sh
      - name: realOpenSshTest on Linux
        working-directory: java
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :portal-ssh:realOpenSshTest \
            -Pportal.test.openssh.host=127.0.0.1 \
            -Pportal.test.openssh.port="$PORTAL_OPENSSH_PORT" \
            -Pportal.test.openssh.idle-port="$PORTAL_OPENSSH_IDLE_PORT" \
            -Pportal.test.openssh.user="$PORTAL_OPENSSH_USER" \
            -Pportal.test.openssh.key-file="$PORTAL_OPENSSH_KEY_FILE" \
            -Pportal.test.openssh.known-hosts="$PORTAL_OPENSSH_KNOWN_HOSTS" \
            -Pportal.test.openssh.platform=linux
      # Case S-D0111-01: without any -Pportal.test.* property the test JVM carries no processor limit and no heap of the repository's own (TestJvmSizeTest checks the JVM it runs in).
      # No -P is given here on purpose.
      - name: Test JVM sizes without -P properties
        working-directory: java
        run: ./gradlew --no-daemon --console=plain :portal-arch-checks:test
      # Case S-D0117-09: the unit tests of the file rules need permission bits and symbolic links, which this runner has and a Windows user token does not. The property says so:
      # a test that needs one of them and does not find it fails here instead of skipping (the build hands the property to the test JVM, the test code reads it). The property
      # is not one of the sizes of the test JVM (portal.test.cpus, heap, forks), so the step above is not affected. Every Java module (including full portal-ssh, portal-migrate,
      # portal-desktop and portal-client) runs here so permission-bit assertions run on Linux as well as Windows (defect SSH_PORTAL-D-0174). The embedded SFTP server rename race
      # (defect SSH_PORTAL-D-0131) is fixed in FaultInjectingSftpAccessor via createLink+delete.
      - name: Unit tests of all modules, with permission bits and symbolic links required
        working-directory: java
        run: >-
          ./gradlew --no-daemon --console=plain --continue
          :portal-domain:test :portal-app:test :portal-store:test :portal-server:test :portal-web:test
          :portal-ssh:test :portal-migrate:test :portal-desktop:test :portal-client:test
          -Pportal.test.require=posix,links
      # What the tests of this job ran, and every test that was skipped with its reason (java/ci/TestSummary.java reads the JUnit reports). The job fails on a skipped test whose
      # reason is not named here, so that a test that silently stopped running is a failure. The one skip a Linux runner has by nature: the tests of the access control list rules
      # need a file system with an access control list view (NTFS), and a Linux file system has the permission bits only; the Windows job runs them (its own skips are listed there).
      - name: Summary of the tests and the skipped ones
        if: always()
        shell: bash
        run: java java/ci/TestSummary.java --allow-skip='has no acl view (it is a posix store)' java/*/build/test-results
      - name: Stop the OpenSSH server and remove the account
        if: always()
        run: sh java/ci/openssh-linux.sh stop
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-openssh-linux-test-results
          path: |
            java/portal-ssh/build/test-results/realOpenSshTest/*.xml
            java/portal-ssh/build/reports/tests/realOpenSshTest
            java/*/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  openssh-windows:
    name: Real OpenSSH on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the OpenSSH server (capability, account, sshd as SYSTEM)
        shell: cmd
        run: call java\ci\openssh-windows.cmd
      # Git Bash is on every Windows runner; the Gradle wrapper script of the repository is the POSIX one.
      - name: realOpenSshTest on Windows
        shell: bash
        working-directory: java
        run: |
          ./gradlew --no-daemon --console=plain :portal-ssh:realOpenSshTest \
            -Pportal.test.openssh.host=127.0.0.1 \
            -Pportal.test.openssh.port="$PORTAL_OPENSSH_PORT" \
            -Pportal.test.openssh.idle-port="$PORTAL_OPENSSH_IDLE_PORT" \
            -Pportal.test.openssh.user="$PORTAL_OPENSSH_USER" \
            -Pportal.test.openssh.key-file="$PORTAL_OPENSSH_KEY_FILE" \
            -Pportal.test.openssh.known-hosts="$PORTAL_OPENSSH_KNOWN_HOSTS" \
            -Pportal.test.openssh.platform=windows \
            -Pportal.test.openssh.windows-python="$PORTAL_OPENSSH_WINDOWS_PYTHON"
      # Case S-D0117-09: the tests of the access control list rules need an NTFS volume, which only this job has (the Linux job has permission bits and runs the tests for those;
      # its ACL tests are skipped there). -Pportal.test.require=acl,links makes a test that needs an access control list or a symbolic link fail instead of skipping. Links are in
      # the list because this runner's administrator token can make them (the report of the run before this change had no skipped test that needed one), so a runner that can no
      # longer make them is a failure and not a quiet skip. Permission bits (posix) cannot be required here: an NTFS volume has none, and a FIFO (mkfifo) does not exist; the tests
      # that need them are the 12 skipped tests whose reason says "no posix view (it is an NTFS volume)", and they run on the Linux job with posix required. Two tests are skipped
      # for a reason that is a fact about the account: they need a removal to fail, and the elevated administrator token of the runner can delete what the list forbids it to
      # delete (their skip message says "this account could delete the probe"); the "cannot be removed again" tests of AclPrivateStorageTest and PrivateFileRuleTest are therefore
      # verified only by local runs with an account that is not an administrator. The whole check of all modules runs here; the tests change real ACLs in the runner's temporary
      # folder.
      - name: Full Gradle check across all modules with access control lists required
        shell: bash
        working-directory: java
        run: >-
          ./gradlew --no-daemon --console=plain --continue check -Pportal.test.require=acl,links
      # What the tests of this job ran and which were skipped, with the reasons (java/ci/TestSummary.java). The job fails on a skipped test whose reason is not one of the two
      # named above: no posix view on an NTFS volume (principled, see the comment above, and run on the Linux job), and an account that could delete the probe.
      - name: Summary of the tests and the skipped ones
        if: always()
        shell: bash
        run: java java/ci/TestSummary.java --allow-skip='has no posix view (it is an NTFS volume)' --allow-skip='this account could delete the probe' java/*/build/test-results
      # Diagnostic: the server log (LogLevel VERBOSE, no command text) of the sshd the preparation script started.
      # It runs whatever the tests did and cannot fail the job (continue-on-error), so it never hides the result of the tests. First it prints, for reference only, how many ping commands
      # started after the prepared sshd are running and how many sshd processes exist. The ping count is not evidence for case S-D0038-02: a 15 s command ends by itself
      # before the step counts, so zero proves nothing. Nothing is ended before the counts are printed. The log is read with a sharing mode first; on this job that read
      # is usually refused while the prepared sshd runs, so the usual path is the one in the catch block: the step says so, ends the sshd processes and the ping commands
      # it counted, then reads the file once more. This is a diagnostic of the CI job, not product or test code.
      - name: Show the log of the prepared sshd
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:ProgramData 'portal-openssh-ci\sshd.log'
          $prepared = Get-CimInstance Win32_Process -Filter "Name = 'sshd.exe'" | Where-Object { $_.CommandLine -like '*portal-openssh-ci*' } | Select-Object -First 1
          $since = if ($prepared) { $prepared.CreationDate } else { (Get-Date).AddMinutes(-30) }
          function Read-SshdLog {
            $fs = [System.IO.File]::Open($log, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]'ReadWrite,Delete')
            try { $text = [System.IO.StreamReader]::new($fs).ReadToEnd() } finally { $fs.Dispose() }
            $lines = $text -split "`r?`n"
            Write-Host ('--- sshd.log, ' + $lines.Count + ' lines, the last 300')
            $lines | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }
          }
          $leftover = @(Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $since -and $_.CommandLine -like '*ping*-n*' } | ForEach-Object { $_.ProcessId })
          $sshdCount = @(Get-Process -Name sshd -ErrorAction SilentlyContinue).Count
          Write-Host ('--- when the tests ended: ' + $leftover.Count + ' ping command(s) started after the prepared sshd are still running, ' + $sshdCount + ' sshd process(es)')
          try {
            Read-SshdLog
          } catch {
            Write-Host ('--- the log cannot be read (' + $_.Exception.Message + '); ending the ' + $sshdCount + ' sshd process(es) and the ' + $leftover.Count + ' ping command(s) counted above')
            Stop-ScheduledTask -TaskName PortalOpenSshCi -ErrorAction Continue
            Get-Process -Name sshd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction Continue
            Get-Process -Name sshd -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction Continue
            $leftover | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            $leftover | ForEach-Object { Wait-Process -Id $_ -Timeout 10 -ErrorAction SilentlyContinue }
            Read-SshdLog
          }
      - name: Stop the OpenSSH server and remove the account
        if: always()
        shell: cmd
        run: call java\ci\openssh-windows.cmd stop
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-openssh-windows-test-results
          path: |
            java/portal-ssh/build/test-results/realOpenSshTest/*.xml
            java/portal-ssh/build/reports/tests/realOpenSshTest
            java/*/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
