name: Java real OpenSSH

# The SSH adapter of the Java 3.0 line against a real OpenSSH server (stage 3 design 7.2, 7.3 and decision D3-11).
# The tests (:portal-ssh:realOpenSshTest) are Java; only the preparation of the server (an OS account, a sudoers rule, sshd) is a script, because the JDK has no API for it:
#   Linux   java/ci/openssh-linux.sh     a second sshd on the runner, an account that may run sftp-server through sudo -n
#   Windows java/ci/openssh-windows.cmd  the OpenSSH Server capability, a non-administrator account, sshd as SYSTEM in a scheduled task
# The task fails when a property is missing and when it ran no test, so a job can neither skip nor pass without a real server.

on:
  push:
    branches: [develop, 'feature/v300-**']
    paths:
      - 'java/**'
      - '.github/workflows/java-openssh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-openssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openssh-linux:
    name: Real OpenSSH on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same pins as linux-regression.yml and windows-ssh.yml (the official actions/checkout and actions/upload-artifact repositories).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Official action, major tag.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the OpenSSH server (account, sudoers rule, sshd)
        run: sh java/ci/openssh-linux.sh
      - name: realOpenSshTest on Linux
        working-directory: java
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :portal-ssh:realOpenSshTest \
            -Pportal.test.openssh.host=127.0.0.1 \
            -Pportal.test.openssh.port="$PORTAL_OPENSSH_PORT" \
            -Pportal.test.openssh.idle-port="$PORTAL_OPENSSH_IDLE_PORT" \
            -Pportal.test.openssh.user="$PORTAL_OPENSSH_USER" \
            -Pportal.test.openssh.key-file="$PORTAL_OPENSSH_KEY_FILE" \
            -Pportal.test.openssh.known-hosts="$PORTAL_OPENSSH_KNOWN_HOSTS" \
            -Pportal.test.openssh.platform=linux
      - name: Stop the OpenSSH server and remove the account
        if: always()
        run: sh java/ci/openssh-linux.sh stop
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-openssh-linux-test-results
          path: |
            java/portal-ssh/build/test-results/realOpenSshTest/*.xml
            java/portal-ssh/build/reports/tests/realOpenSshTest
          if-no-files-found: warn
          retention-days: 14

  openssh-windows:
    name: Real OpenSSH on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare the OpenSSH server (capability, account, sshd as SYSTEM)
        shell: cmd
        run: call java\ci\openssh-windows.cmd
      # Diagnostic of the prepared server, independent of the Java tests: how long does the sshd of this runner keep a connection to the idle port that has no open channel
      # (ssh -N opens none), as seen by the OpenSSH client of the same machine? Probe 1 sends nothing after authentication; probe 2 sends a keep-alive each second.
      # It cannot fail the job.
      - name: Probe the UnusedConnectionTimeout of the idle port with the OpenSSH client
        continue-on-error: true
        shell: pwsh
        run: |
          $ssh = Join-Path $env:SystemRoot 'System32\OpenSSH\ssh.exe'
          foreach ($alive in @(0, 1)) {
            $err = Join-Path $env:RUNNER_TEMP ('probe-' + $alive + '.err')
            $argList = @('-v', '-N', '-p', $env:PORTAL_OPENSSH_IDLE_PORT, '-i', $env:PORTAL_OPENSSH_KEY_FILE, '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes',
              '-o', 'StrictHostKeyChecking=yes', '-o', ('UserKnownHostsFile=' + $env:PORTAL_OPENSSH_KNOWN_HOSTS), '-o', ('ServerAliveInterval=' + $alive),
              ($env:PORTAL_OPENSSH_USER + '@127.0.0.1'))
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $ssh -ArgumentList $argList -PassThru -NoNewWindow -RedirectStandardError $err
            $exited = $p.WaitForExit(20000)
            $ms = $sw.ElapsedMilliseconds
            if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host ('probe ServerAliveInterval=' + $alive + ': exited=' + $exited + ' after ' + $ms + ' ms' + $(if ($exited) { ', exit code ' + $p.ExitCode } else { ' (ended by the probe after 20 s)' }))
            Get-Content -LiteralPath $err -Tail 6 | ForEach-Object { Write-Host ('  ' + $_) }
          }
      # Diagnostic: the probe above shows that this sshd ends an idle-port connection in about 4 s, and its log shows the same decision for the connection of S-D0038-01,
      # yet the Java client session stays open for 30 s although its keep-alive (15 s) would fail on a reset connection. A hidden process notes every change of the TCP
      # connections of the idle port (state and owning process, both ends) while the tests run, so that a process that still holds the server end is named. The next
      # diagnostic step prints the note. It cannot fail the job.
      - name: Watch the TCP connections of the idle port while the tests run
        continue-on-error: true
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'idle-watch.ps1'
          Set-Content -LiteralPath $script -Value @'
          $idle = [int] $env:PORTAL_OPENSSH_IDLE_PORT
          $out = Join-Path $env:RUNNER_TEMP 'idle-watch.log'
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $last = ''
          $known = @{}
          while ($watch.Elapsed.TotalMinutes -lt 20) {
            $rows = @(Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -eq $idle -or $_.RemotePort -eq $idle })
            $now = ($rows | Sort-Object LocalPort, RemotePort | ForEach-Object { '{0}>{1} {2} pid {3}' -f $_.LocalPort, $_.RemotePort, $_.State, $_.OwningProcess }) -join ' | '
            if ($now -ne $last) {
              Add-Content -LiteralPath $out -Value ((Get-Date).ToString('HH:mm:ss.fff') + ' ' + $now)
              $last = $now
              foreach ($r in $rows) {
                if (-not $known.ContainsKey([int] $r.OwningProcess)) {
                  $known[[int] $r.OwningProcess] = $true
                  $p = Get-CimInstance Win32_Process -Filter ('ProcessId = ' + $r.OwningProcess) -ErrorAction SilentlyContinue
                  if ($p) { Add-Content -LiteralPath $out -Value ('    pid ' + $p.ProcessId + ' = ' + $p.Name + ', parent ' + $p.ParentProcessId + ', ' + ([string] $p.CommandLine).Substring(0, [Math]::Min(120, ([string] $p.CommandLine).Length))) }
                }
              }
            }
            Start-Sleep -Milliseconds 250
          }
          '@
          Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-NonInteractive', '-File', $script) -WindowStyle Hidden
          Write-Host ('watching the idle port ' + $env:PORTAL_OPENSSH_IDLE_PORT + ' into ' + (Join-Path $env:RUNNER_TEMP 'idle-watch.log'))
      # Git Bash is on every Windows runner; the Gradle wrapper script of the repository is the POSIX one.
      - name: realOpenSshTest on Windows
        shell: bash
        working-directory: java
        run: |
          ./gradlew --no-daemon --console=plain :portal-ssh:realOpenSshTest \
            -Pportal.test.openssh.host=127.0.0.1 \
            -Pportal.test.openssh.port="$PORTAL_OPENSSH_PORT" \
            -Pportal.test.openssh.idle-port="$PORTAL_OPENSSH_IDLE_PORT" \
            -Pportal.test.openssh.user="$PORTAL_OPENSSH_USER" \
            -Pportal.test.openssh.key-file="$PORTAL_OPENSSH_KEY_FILE" \
            -Pportal.test.openssh.known-hosts="$PORTAL_OPENSSH_KNOWN_HOSTS" \
            -Pportal.test.openssh.platform=windows \
            -Pportal.test.openssh.windows-python="$PORTAL_OPENSSH_WINDOWS_PYTHON"
      # Diagnostic: the server log (LogLevel VERBOSE, no command text) of the sshd the preparation script started, and the sshd processes at that moment.
      # It runs whatever the tests did and cannot fail the job (continue-on-error), so it never hides the result of the tests. Stop-ScheduledTask ends only the
      # parent sshd; the connection processes that sshd started keep the log open without a read share, so the log is read with a sharing mode first, and when that is
      # refused every sshd process is ended (Stop-Process) and the file is read afterwards. This is a diagnostic of the CI job, not product or test code.
      - name: Show the log of the prepared sshd
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:ProgramData 'portal-openssh-ci\sshd.log'
          # Every process that started after the prepared sshd (the one with -E), by name and parent, because the log stayed locked when no sshd process was left:
          # a child that sshd started (sftp-server, ssh-shellhost, a command of a test) may still hold the log handle it inherited.
          $prepared = Get-CimInstance Win32_Process -Filter "Name = 'sshd.exe'" | Where-Object { $_.CommandLine -like '*portal-openssh-ci*' } | Select-Object -First 1
          $since = if ($prepared) { $prepared.CreationDate } else { (Get-Date).AddMinutes(-30) }
          function Show-Processes([string] $title) {
            Write-Host ('--- ' + $title + ' (started since the prepared sshd, pid ' + $prepared.ProcessId + ')')
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $since } | Sort-Object CreationDate |
              ForEach-Object { '{0,6} parent {1,6} {2:HH:mm:ss} {3} {4}' -f $_.ProcessId, $_.ParentProcessId, $_.CreationDate, $_.Name, ([string] $_.CommandLine).Substring(0, [Math]::Min(160, ([string] $_.CommandLine).Length)) } | Write-Host
          }
          Write-Host '--- TCP connections of the idle port, each change (local>remote state pid; the server end has the idle port as local port)'
          $watchLog = Join-Path $env:RUNNER_TEMP 'idle-watch.log'
          if (Test-Path -LiteralPath $watchLog) { Get-Content -LiteralPath $watchLog | ForEach-Object { Write-Host $_ } } else { Write-Host '(no note)' }
          Show-Processes 'processes before anything is ended'
          function Read-SshdLog {
            $fs = [System.IO.File]::Open($log, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]'ReadWrite,Delete')
            try { $text = [System.IO.StreamReader]::new($fs).ReadToEnd() } finally { $fs.Dispose() }
            $lines = $text -split "`r?`n"
            Write-Host ('--- sshd.log, ' + $lines.Count + ' lines, the last 300')
            $lines | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }
          }
          try {
            Read-SshdLog
          } catch {
            Write-Host ('--- the log is locked (' + $_.Exception.Message + '); ending every sshd process')
            Stop-ScheduledTask -TaskName PortalOpenSshCi -ErrorAction Continue
            Get-Process -Name sshd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction Continue
            Get-Process -Name sshd -ErrorAction SilentlyContinue | Wait-Process -Timeout 15 -ErrorAction Continue
            # The tests leave commands that outlive their session (the previous run listed cmd.exe /c "ping -n 120 127.0.0.1" children of a connection process that was gone).
            # They inherited the log handle from sshd, and nothing else keeps the file open, so they are ended too.
            $leftover = @(Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $since -and $_.CommandLine -like '*ping*-n*' } | ForEach-Object { $_.ProcessId })
            $leftover | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            $leftover | ForEach-Object { Wait-Process -Id $_ -Timeout 10 -ErrorAction SilentlyContinue }
            Show-Processes 'processes after every sshd process and every ping command was ended'
            Read-SshdLog
          }
      - name: Stop the OpenSSH server and remove the account
        if: always()
        shell: cmd
        run: call java\ci\openssh-windows.cmd stop
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-openssh-windows-test-results
          path: |
            java/portal-ssh/build/test-results/realOpenSshTest/*.xml
            java/portal-ssh/build/reports/tests/realOpenSshTest
          if-no-files-found: warn
          retention-days: 14
